name: Publish to PyPI

# Triggers on the same v* tag push that drives the binary build workflow,
# so a single `git push origin v1.2.0` ships both the PyPI sdist/wheel and
# the standalone Linux/Windows executables in one release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  # Required for PyPI Trusted Publishing (OIDC). No long-lived API token is
  # stored as a GitHub secret -- PyPI verifies the workflow identity directly.
  id-token: write
  contents: read

jobs:
  publish:
    name: Build sdist + wheel and publish to PyPI
    runs-on: ubuntu-22.04

    # Environment must match the trusted publisher configured on PyPI.
    # Setup (one-time, on PyPI):
    #   1. Sign in at https://pypi.org/manage/account/publishing/
    #   2. Add a pending publisher for project `gws-security-auditor`:
    #        Owner: argusssec-cloud
    #        Repository: gws-auditor
    #        Workflow: publish-pypi.yml
    #        Environment: pypi
    #   3. Push a v* tag -- the first run claims the project on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/p/gws-security-auditor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $pkg"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches pyproject.toml version $pkg"

      - name: Build sdist and wheel
        # Use the `pyproject-build` console script instead of `python -m build`.
        # The repo contains a `build.py` (PyInstaller wrapper) at root which
        # would shadow the `build` PyPI module under `-m` resolution and run
        # the wrong thing.
        run: pyproject-build

      - name: List build artifacts
        run: ls -la dist/

      - name: Sanity-check artifacts
        run: |
          test -f dist/gws_security_auditor-*.tar.gz || { echo "::error::sdist missing"; exit 1; }
          test -f dist/gws_security_auditor-*.whl    || { echo "::error::wheel missing"; exit 1; }

      - name: Publish to PyPI
        # No `with: password:` -- uses OIDC Trusted Publishing.
        uses: pypa/gh-action-pypi-publish@release/v1
